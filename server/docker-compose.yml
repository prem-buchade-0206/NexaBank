services:
  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # replicaSet=rs0 is required: the Transactions module uses real
      # multi-document MongoDB transactions, which only work on a replica set.
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URI: redis://redis:6379/0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Single-node replica set. MongoDB transactions (used atomically by the
  # Transactions module for deposit/withdraw/transfer) require a replica
  # set even in local development — a standalone mongod does not support them.
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot job: initiates the replica set on first boot, then exits.
  # Subsequent restarts are no-ops (rs.initiate() on an already-initiated
  # set fails harmlessly and the `|| true` lets the container exit 0).
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - >
        mongosh --host mongo:27017 --eval
        'rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]})'
        || true
    restart: "no"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
